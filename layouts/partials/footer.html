<footer class="site-footer">
  <ul class="socials">
    {{ range site.Params.socials }}<li><a href="{{ .url }}" rel="me noopener" target="_blank">{{ .name }}</a></li>{{ end }}
    {{ with site.Home.OutputFormats.Get "RSS" }}<li><a href="{{ .RelPermalink }}">RSS</a></li>{{ end }}
  </ul>
  <p>&copy; {{ now.Year }} {{ site.Params.name }}</p>
</footer>

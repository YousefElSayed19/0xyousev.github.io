{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if in (slice "writeups" "blogs") .Section }}
  <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>{{ range .Params.tags }} <span class="tag">{{ . }}</span>{{ end }}</p>
  {{ end }}
  <div class="content">{{ .Content }}</div>
</article>
{{ end }}
